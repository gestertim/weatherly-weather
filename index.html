<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f1">
  <title>Weatherly - 掌握天氣，從容出發</title>
  <style>
    :root { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242a28; background: #f6f5f1; font-size: 15px; --surface: #fff; --line: #e5e6df; --muted: #737b75; --accent: #ad650f; --tint: #faf0dc; --hero: #fbf3e4; --shadow: 0 5px 22px #303a2611; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #6c9982; outline-offset: 4px; }
    .shell { max-width: 744px; margin: auto; padding: 45px 24px 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 750; letter-spacing: -.9px; }
    .brand svg { color: #b37a29; width: 29px; height: 29px; }
    .tagline { color: var(--muted); font-size: 12px; }
    .header-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    header { gap: 12px; }
    html[lang="zh-Hant"] h1 { letter-spacing: 0; }
    .intro { margin-bottom: 24px; }
    h1 { font-size: clamp(29px, 5vw, 36px); letter-spacing: -1.35px; margin: 0 0 10px; font-weight: 650; }
    .intro p { color: var(--muted); margin: 0; line-height: 1.6; }
    .search { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); padding: 7px 8px 7px 17px; border-radius: 14px; box-shadow: 0 2px 3px #28382b03; }
    .search > svg { width: 19px; height: 19px; color: var(--muted); flex-shrink: 0; }
    input { width: 100%; min-width: 0; border: 0; outline: none; background: transparent; color: inherit; padding: 10px 0; }
    input::placeholder { color: #8a918c; }
    .search button { background: #2f493c; color: #fff; border: 0; border-radius: 9px; padding: 11px 20px; font-size: 13px; font-weight: 600; transition: background .2s; }
    .search button:hover { background: #466653; }
    .search button:disabled { opacity: .6; cursor: wait; }
    .search-area { margin-bottom: 27px; }
    .results { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); padding: 6px; border-radius: 12px; margin-top: 8px; }
    .results[hidden] { display: none; }
    .results button { background: transparent; color: inherit; border: 0; text-align: left; padding: 12px; border-radius: 7px; }
    .results button:hover { background: var(--tint); }
    .message { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 9px 3px 0; }
    .message:empty { display: none; }
    .location-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 17px; }
    h2 { font-size: 21px; letter-spacing: -.5px; font-weight: 650; margin: 0; }
    .location-title { display: flex; align-items: center; gap: 7px; }
    .location-title svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
    .country { color: var(--muted); font-size: 12px; margin-top: 5px; padding-left: 24px; }
    .units { display: flex; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 3px; flex-shrink: 0; }
    .units button { border: 0; border-radius: 6px; padding: 6px 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
    .units button[aria-pressed="true"] { color: #fff; background: #2f493c; }
    .current { overflow: hidden; position: relative; border: 1px solid color-mix(in srgb, var(--accent) 15%, var(--line)); background: var(--hero); border-radius: 20px; padding: 26px 28px 0; transition: background .4s; }
    .current-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .eyebrow { text-transform: uppercase; letter-spacing: 1.65px; font-size: 10px; font-weight: 700; color: var(--accent); }
    .source { font-size: 10px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .source::before { content: ""; height: 5px; width: 5px; background: currentColor; border-radius: 50%; }
    .weather-main { display: flex; justify-content: space-between; align-items: center; min-height: 192px; gap: 10px; }
    .temperature { font-size: clamp(66px, 12vw, 86px); font-weight: 350; letter-spacing: -6px; line-height: 1.1; }
    .temperature span { font-size: .45em; vertical-align: top; letter-spacing: -1px; display: inline-block; margin-top: 10px; font-weight: 400; }
    .condition { font-weight: 600; font-size: 16px; margin-top: 8px; }
    .high-low { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .hero-art { position: relative; width: 190px; height: 170px; display: grid; place-items: center; flex-shrink: 0; }
    .hero-art::before { content: ""; position: absolute; width: 156px; height: 156px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: 0 0 0 16px color-mix(in srgb, var(--accent) 3%, transparent); }
    .hero-art svg { width: 145px; height: 145px; position: relative; filter: drop-shadow(0 8px 5px #64421112); }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid color-mix(in srgb, var(--accent) 15%, transparent); padding: 20px 0; margin-top: 3px; }
    .metric { padding-left: 24px; border-left: 1px solid color-mix(in srgb, var(--accent) 15%, transparent); }
    .metric:first-child { padding-left: 0; border: 0; }
    .metric-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; margin-bottom: 7px; }
    .metric-label svg { width: 14px; height: 14px; }
    .metric-value { font-size: 16px; font-weight: 600; }
    .forecast-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 29px 0 14px; }
    h3 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.2px; }
    .forecast-heading span { color: var(--muted); font-size: 11px; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .day { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; text-align: center; padding: 18px 6px 16px; box-shadow: 0 2px 4px #303a2603; }
    .day-name { font-size: 12px; font-weight: 650; }
    .day-date { font-size: 10px; color: var(--muted); margin-top: 5px; }
    .day svg { width: 48px; height: 48px; margin: 17px 0 10px; }
    .day-condition { color: var(--muted); font-size: 10px; min-height: 25px; line-height: 1.3; }
    .day-temps { font-size: 14px; font-weight: 600; margin-top: 8px; white-space: nowrap; }
    .day-temps span { color: var(--muted); font-weight: 400; margin-left: 5px; }
    .rain { color: #7b929c; display: flex; justify-content: center; align-items: center; gap: 3px; font-size: 10px; margin-top: 11px; }
    .rain svg { margin: 0; width: 11px; height: 11px; }
    .note { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .note svg { color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
    footer { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 10px; padding: 24px 1px 5px; }
    a { color: inherit; text-underline-offset: 3px; }
    .footer-mark { letter-spacing: .3px; }
    @media (max-width: 520px) {
      .shell { padding: 25px 18px 18px; } header { margin-bottom: 34px; } .tagline { font-size: 10px; }
      .current { padding: 22px 20px 0; } .hero-art { width: 125px; } .hero-art svg { width: 112px; height: 112px; } .hero-art::before { width: 108px; height: 108px; }
      .weather-main { min-height: 184px; } .metric { padding-left: 13px; } .metric-value { font-size: 14px; } .metric-label { font-size: 10px; gap: 4px; }
      .forecast { gap: 6px; } .day { padding: 15px 3px; border-radius: 11px; } .day svg { width: 37px; height: 37px; } .day-condition { font-size: 9px; min-height: 26px; } .day-temps { font-size: 12px; } .day-temps span { margin-left: 2px; }
      .search button { padding: 11px 14px; } .forecast-heading span { font-size: 10px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #e9eee8; background: #151c19; --surface: #1d2722; --line: #303d34; --muted: #a1ada4; --tint: #30382a; --hero: #302d21; --accent: #edbe75; }
      .brand svg { color: #edbe75; } .search button, .units button[aria-pressed="true"] { background: #b4cbb8; color: #1b2b21; }
      .search button:hover { background: #cee0d1; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">

      <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="2"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>weatherly<span style="color:#b37a29">.</span></div>
      <div class="header-tools">
        <div class="units" role="group" data-i18n-aria="language" aria-label="介面語言"><button type="button" data-language="zh-Hant" lang="zh-Hant" aria-pressed="true">繁中</button><button type="button" data-language="en" lang="en" aria-pressed="false">English</button></div>

      </section>
    </main>
    <footer><span><span data-i18n="attribution">天氣資料來源：</span><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></span><span id="updated" class="footer-mark">為每一天的旅程而生。</span></footer>

  <script>

    const translations = {

      const cloud = '<path d="M24 72a17 17 0 0 1-1-34 24 24 0 0 1 45-6 20 20 0 1 1 8 40Z" fill="#b8cbd0"/><path d="M24 68a13 13 0 0 1 0-26h3a20 20 0 0 1 38-5l2 1 3-1a16 16 0 1 1 6 31Z" fill="#edf3ee"/>';
      let drawing = sunny ? sun : (code === 2 ? '<g transform="translate(5,-9) scale(.8)">' + sun + '</g>' : '') + cloud;
      if (snow) drawing += '<g fill="#88b9d1"><circle cx="32" cy="84" r="3"/><circle cx="51" cy="90" r="3"/><circle cx="70" cy="83" r="3"/></g>';
      else if (thunder) drawing += '<path d="m52 63-14 21h13l-6 15 21-24H53l8-12Z" fill="#edb34b"/>';
      else if (rain) drawing += '<path d="m33 81-4 9m23-9-4 9m23-9-4 9" stroke="#77a9c5" stroke-width="4" stroke-linecap="round"/>';
      if (fog) drawing += '<path d="M18 80h64M26 90h48" stroke="#a3b8b8" stroke-width="4" stroke-linecap="round"/>';
      return '<svg viewBox="0 0 100 104" fill="none" aria-hidden="true">' + drawing + '</svg>';
    };
    function weatherInfo(code) {
      if (code === 0) return [t('clear'), 'sun', t('sunTip')];
      if (code <= 2) return [t('partlyCloudy'), 'sun', t('partlyCloudyTip')];
      if (code === 3) return [t('overcast'), 'cloud', t('cloudTip')];
      if (code <= 48) return [t('foggy'), 'cloud', t('fogTip')];
      if ([71, 73, 75, 77, 85, 86].includes(code)) return [t('snowy'), 'snow', t('snowTip')];
      if (code >= 95) return [t('thunder'), 'rain', t('thunderTip')];
      return [t(code < 60 ? 'drizzle' : code >= 80 ? 'showers' : 'rainy'), 'rain', t('rainTip')];
    }
    const temp = value => Math.round(unit === 'f' ? value * 9 / 5 + 32 : value);
    const drop = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3S6 11 6 15a6 6 0 0 0 12 0c0-4-6-12-6-12Z"/></svg>';
    function render() {
      renderLanguage();
      const { city, data, live } = state;
      const current = data.current;
      const daily = data.daily;
      const [label, theme, tip] = weatherInfo(current.weather_code);
      const palettes = darkMode.matches
        ? { sun: ['#302d21', '#edbe75'], cloud: ['#25302e', '#abc6bc'], rain: ['#202e39', '#9cbfd8'], snow: ['#24313b', '#b5cddb'] }
        : { sun: ['#fbf3e4', '#ad650f'], cloud: ['#edf2ed', '#526d5b'], rain: ['#eaf1f8', '#4b769a'], snow: ['#edf4f8', '#547f99'] };
      document.documentElement.style.setProperty('--hero', palettes[theme][0]);
      document.documentElement.style.setProperty('--accent', palettes[theme][1]);
      $('city-name').textContent = cityName(city);
      const date = live ? new Intl.DateTimeFormat(language, { weekday: 'long', month: 'short', day: 'numeric', timeZone: data.timezone }).format(new Date()) : t('sampleDate');
      $('city-detail').textContent = [city.admin1, countryName(city), date].filter(Boolean).join(' · ');
      $('temperature').innerHTML = temp(current.temperature_2m) + '<span>°' + unit.toUpperCase() + '</span>';
      $('condition').textContent = current.is_day === 0 && current.weather_code <= 1 ? t('clearNight') : label;
      $('high-low').textContent = t('high') + ' ' + temp(daily.temperature_2m_max[0]) + '° / ' + t('low') + ' ' + temp(daily.temperature_2m_min[0]) + '°';
      $('hero-art').innerHTML = icon(current.weather_code, current.is_day === 0);
      $('feels-like').textContent = temp(current.apparent_temperature) + '°';
      $('humidity').textContent = Math.round(current.relative_humidity_2m) + '%';
      $('wind').textContent = Math.round(current.wind_speed_10m) + ' ' + t('windUnit');
      $('data-source').textContent = t(live ? 'live' : 'sample');
      $('weather-tip').textContent = tip;
      $('updated').textContent = live ? t('updated', { time: new Intl.DateTimeFormat(language, { hour: 'numeric', minute: '2-digit', timeZone: data.timezone }).format(state.fetchedAt) }) : t('offline');
      $('forecast').replaceChildren();
      for (let i = 1; i <= 5; i++) {
        const day = document.createElement('article');
        day.className = 'day';
        const dayDate = new Date(daily.time[i] + 'T12:00:00Z');
        const description = weatherInfo(daily.weather_code[i])[0];
        day.innerHTML = '<div class="day-name">' + (live && i === 1 ? t('tomorrow') : dayDate.toLocaleDateString(language, { weekday: 'short', timeZone: 'UTC' })) + '</div><div class="day-date">' + dayDate.toLocaleDateString(language, { month: 'short', day: 'numeric', timeZone: 'UTC' }) + '</div>' + icon(daily.weather_code[i]) + '<div class="day-condition">' + description + '</div><div class="day-temps">' + temp(daily.temperature_2m_max[i]) + '°<span>' + temp(daily.temperature_2m_min[i]) + '°</span></div><div class="rain" aria-label="' + t('rainChance', { value: daily.precipitation_probability_max[i] }) + '">' + drop + daily.precipitation_probability_max[i] + '%</div>';
        $('forecast').append(day);
      }
    }
    async function fetchJSON(url, controller) {
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error('Weather service returned ' + response.status);
        return await response.json();
      } finally { clearTimeout(timeout); }
    }
    function validWeather(data) {
      const fields = ['temperature_2m', 'apparent_temperature', 'relative_humidity_2m', 'wind_speed_10m', 'weather_code', 'is_day'];
      const arrays = ['weather_code', 'temperature_2m_max', 'temperature_2m_min', 'precipitation_probability_max'];
      return data && typeof data.timezone === 'string' && data.current && fields.every(key => Number.isFinite(data.current[key])) && data.daily && Array.isArray(data.daily.time) && data.daily.time.length >= 6 && data.daily.time.slice(0, 6).every(date => typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(Date.parse(date))) && arrays.every(key => Array.isArray(data.daily[key]) && data.daily[key].length >= 6 && data.daily[key].slice(0, 6).every(Number.isFinite));
    }
    async function loadWeather(city) {
      const request = ++weatherRequest;
      weatherController?.abort();
      const controller = new AbortController();
      weatherController = controller;
      $('weather').setAttribute('aria-busy', 'true');
      setMessage('weather-status', 'loadingWeather', city);
      try {
        const params = new URLSearchParams({ latitude: city.latitude, longitude: city.longitude, current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m', daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max', timezone: 'auto', forecast_days: '6', temperature_unit: 'celsius', wind_speed_unit: 'kmh' });
        const data = await fetchJSON('https://api.open-meteo.com/v1/forecast?' + params, controller);
        if (request !== weatherRequest) return;
        if (!validWeather(data)) throw new Error('Incomplete forecast received');
        new Intl.DateTimeFormat('en', { timeZone: data.timezone });
        state = { city, data, live: true, fetchedAt: new Date() };
        render();
        setMessage('weather-status');
      } catch (error) {
        if (request !== weatherRequest) return;
        console.warn('Unable to load live weather:', error);
        state = { city: tokyo, data: sample, live: false };
        render();
        setMessage('weather-status', 'weatherFailed', city);
      } finally {
        if (request === weatherRequest) $('weather').setAttribute('aria-busy', 'false');
      }
    }
    $('search-form').addEventListener('submit', async event => {
      event.preventDefault();
      const query = $('city-search').value.trim();
      if (!query) { setMessage('search-status', 'enterCity'); return; }
      const request = ++searchRequest;
      searchController?.abort();
      const controller = new AbortController();
      searchController = controller;
      $('search-results').hidden = true;
      $('search-results').replaceChildren();
      $('search-button').disabled = true;
      setMessage('search-status', 'searching');
      try {
        const params = new URLSearchParams({ name: query, count: '5', language: 'en', format: 'json' });
        const data = await fetchJSON('https://geocoding-api.open-meteo.com/v1/search?' + params, controller);
        if (request !== searchRequest) return;
        if (data.error || (data.results !== undefined && !Array.isArray(data.results))) throw new Error('Invalid city search response');
        const cities = (data.results || []).filter(city => typeof city.name === 'string' && Number.isFinite(city.latitude) && Number.isFinite(city.longitude));
        if (!cities.length) { setMessage('search-status', 'noCities'); return; }
        setMessage('search-status', 'chooseCity');
        for (const city of cities) {
          const button = document.createElement('button');
          button.type = 'button';
          button.city = city;
          button.textContent = cityDescription(city);
          button.addEventListener('click', () => {
            $('search-results').hidden = true;
            setMessage('search-status');
            $('city-search').value = city.name;
            loadWeather(city);
          });
          $('search-results').append(button);
        }
        $('search-results').hidden = false;
      } catch (error) {
        if (request !== searchRequest) return;
        console.warn('Unable to search cities:', error);
        setMessage('search-status', 'searchFailed');
      } finally {
        if (request === searchRequest) $('search-button').disabled = false;
      }
    });
    $('city-search').addEventListener('input', () => {
      ++searchRequest;
      searchController?.abort();
      $('search-button').disabled = false;
      $('search-results').hidden = true;
      setMessage('search-status');
    });
    $('city-search').addEventListener('keydown', event => {
      if (event.key === 'Escape') { $('search-results').hidden = true; setMessage('search-status'); }
    });
    document.querySelectorAll('[data-unit]').forEach(button => button.addEventListener('click', () => {
      unit = button.dataset.unit;
      document.querySelectorAll('[data-unit]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    }));
    darkMode.addEventListener('change', render);
    document.querySelectorAll('[data-language]').forEach(button => button.addEventListener('click', () => {
      language = button.dataset.language;
      render();
    }));
    render();
    loadWeather(tokyo);
  </script>
